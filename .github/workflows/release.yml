name: Automatic Release & Changelog

on:
  push:
    tags:
      - 'v*' # Startet automatisch bei Tags wie v1.1.1, v1.2.0 etc.

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Holt die gesamte Historie für korrekte Changelogs

      - name: Create GitHub Release with Auto-Changelog
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true