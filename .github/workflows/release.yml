name: Automatic Release & Changelog

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Clean Changelog
        id: changelog
        run: |
          # Holt alle Commits seit dem letzten Tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="$PREV_TAG..HEAD"
          fi

          # Liest Commits aus, entfernt Issue-Nummern (#123) für sauberes Markdown
          CHANGELOG=$(git log $RANGE --pretty=format:"* %s (%h)" | sed -E 's/#([0-9]+)/[\#\1]/g')

          # Speichert das Ergebnis für das Release
          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          echo "$CHANGELOG" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ env.CHANGELOG }}