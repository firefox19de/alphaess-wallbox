name: Release & Bump Manifest

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Update Manifest and Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Extract Tag Version
        id: prep
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          VERSION=${VERSION#v}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Update manifest version
        run: |
          sed -i 's/"version": ".*"/"version": "${{ steps.prep.outputs.version }}"/' custom_components/alphaess_wallbox/manifest.json

      - name: Commit updated manifest back to repository
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: bump manifest version to ${{ steps.prep.outputs.version }}"
          file_pattern: 'custom_components/alphaess_wallbox/manifest.json'
          branch: main

      - name: Generate Clean Changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="$PREV_TAG..HEAD"
          fi

          CHANGELOG=$(git log $RANGE --pretty=format:"* %s (%h)" | sed -E 's/#([0-9]+)/[\#\1]/g')

          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          echo "$CHANGELOG" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ env.CHANGELOG }}