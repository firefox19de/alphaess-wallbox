name: Publish Add-on to GHCR

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Vollständige Git-Historie laden für Branch-Pushes

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 # Verhindert die Node 20 Deprecation Warning

      - name: Set dynamic version in package.json and config.yaml
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          VERSION=${VERSION#v}
          echo "Extracted Version: $VERSION"
          sed -i "s/^version: .*/version: \"${VERSION}\"/" alphaess_mqtt/config.yaml
          cd alphaess_mqtt
          npm version ${VERSION} --no-git-tag-version --allow-same-version

      - name: Commit updated files back to repository
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: bump version to ${{ github.ref_name }}"
          file_pattern: 'alphaess_mqtt/config.yaml alphaess_mqtt/package.json'
          branch: main # Definiert explizit den Ziel-Branch

      - name: Set up QEMU (for multi-arch builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./alphaess_mqtt
          file: ./alphaess_mqtt/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NODE_OPTIONS=--max-old-space-size=512